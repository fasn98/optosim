# Information about the original article that has been replicated
replication:
 - cite: "Evans, B. D., Jarvis, S., Schultz, S. R., & Nikolić, K. (2016). PyRhO: A Multiscale Optogenetics Simulation Platform. Frontiers in Neuroinformatics, 10, 8."
 - bib:  evans2016
 - url:  https://www.frontiersin.org/articles/10.3389/fninf.2016.00008/full
 - doi:  10.3389/fninf.2016.00008

# Don't forget to surround abstract with double quotes
abstract: "optosim is an open-source, single-compartment optogenetics simulator that re-implements, independently and from the published equations, the three-state channelrhodopsin-2 (ChR2) photocycle distributed in the PyRhO platform, coupled to a Hodgkin-Huxley membrane. Under constant illumination the photocycle is linear and has an exact matrix-exponential solution, which the integrator reproduces to about 1e-14; the converged state matches PyRhO's closed-form steady state to about 1e-12; and the full transient agrees with PyRhO's own integration to 1.7e-8 (1 mW/mm2) and 3.4e-8 (10 mW/mm2), confirming that the equations are transcribed correctly. The contribution beyond this confirmation is methodological: every emitted value carries a machine-checkable origin (measured, derived, predicted or heuristic) that can only degrade through a computation, a build-time check forbids randomness on any output path, and the uncited constants and unmodelled physics (no Q10 temperature correction, no tissue optics) are reported on every run. Agreement with PyRhO establishes correct transcription, not that the model describes the real protein."


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optosim"
version = "0.1.0"
description = "A biophysical optogenetics simulator that never presents a model output as a measurement."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabio" }]
readme = "README.md"
keywords = ["optogenetics", "channelrhodopsin", "hodgkin-huxley", "simulation"]

# Deliberately minimal, for the same reason chemdisco is: the provenance,
# parameter and unit layers are pure Python and must import and be testable in a
# bare environment. Only the numerical integration needs numpy.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]
# PyRhO is the opsin validation reference, not a runtime dependency. It does not
# import on Python 3.12 (see HANDOFF), so it is kept out of the default extras.
validate = ["scipy>=1.11"]

[tool.setuptools.packages.find]
include = ["optosim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["default"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
